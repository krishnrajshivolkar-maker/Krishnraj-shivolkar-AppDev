name: fitness_app
description: A modular fitness tracker app with exercise tracking, weekly plans, profile, and premium features.

publish_to: 'none' # Remove this if you plan to publish

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/coach_logo.png" # your new logo


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^5.0.0
  provider: ^6.0.5
  http: ^1.1.0
  shared_preferences: ^2.1.1
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.1.10
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/premiumlogo.jpg
    - assets/images/icon.jpg
    - assets/images/pre0.1.jpg
    - assets/images/pre2.jpg
    - assets/images/pre0.4.jpg
    - assets/images/pre1.jpg
    - assets/images/pre0.3.jpg
    - assets/images/pre3.jpg
    - assets/images/premium.png
    - assets/images/community.jpg
    - assets/images/personal.jpg
    - assets/images/products.jpg
    - assets/images/coach_logo.png
    - assets/images/google_logo.png

